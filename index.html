<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structural Check Pro 🏗️</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
/* Styles existants conservés */
:root {
--main-color: #2c3e50;
--accent-color: #e74c3c;
}
    body {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        min-height: 100vh;
        position: relative;
    }

    .customization-panel {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
    }

    .main-content {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        padding: 2rem;
        margin-top: 2rem;
        backdrop-filter: blur(10px);
        position: relative;
    }

    h1 {
        color: var(--main-color);
        font-weight: 700;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .btn-custom {
        background: var(--accent-color);
        color: white;
        padding: 12px 25px;
        border-radius: 10px;
        transition: all 0.3s ease;
        border: none;
    }

    .btn-custom:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
    }

    .input-group {
        max-width: 400px;
        margin-bottom: 1rem;
    }

    .input-group input {
        border-radius: 8px;
        border: 2px solid #ced4da;
        transition: border-color 0.3s ease;
    }

    .input-group input:focus {
        border-color: var(--accent-color);
        box-shadow: none;
    }

    .emoji-picker {
        display: flex;
        gap: 10px;
        margin: 1rem 0;
    }

    .emoji-btn {
        font-size: 1.5rem;
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    .emoji-btn:hover {
        transform: scale(1.2);
    }

    #backgroundImage {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
        opacity: 0.3;
    }

    .result-box {
        padding: 1rem;
        border: 1px solid #ddd;
        margin: 1rem 0;
    }

    .verified { color: green; font-weight: bold; }
    .not-verified { color: red; font-weight: bold; }
</style>
</head>
<body>
<!-- Customization Panel -->
<div class="customization-panel">
<button class="btn btn-custom mb-2" onclick="document.getElementById('bgUpload').click()">🎨 Customize</button>
<input type="file" id="bgUpload" hidden accept="image/*">
<div class="emoji-picker" id="emojiPicker" style="display: none;">
<span class="emoji-btn" onclick="addEmoji('🌸')">🌸</span>
<span class="emoji-btn" onclick="addEmoji('🐰')">🐰</span>
<span class="emoji-btn" onclick="addEmoji('🍭')">🍭</span>
<span class="emoji-btn" onclick="addEmoji('🌈')">🌈</span>
</div>
</div>
<!-- Background Image -->
<img id="backgroundImage" src="" alt="Background">

<!-- Main Content -->
<div class="container">
    <div class="main-content">
        <h1 class="text-center mb-4">🔍 Structural Check Pro 🏗️</h1>

        <!-- Start Button -->
        <div class="text-center" id="startSection">
            <button class="btn btn-custom btn-lg" onclick="startVerification()">
                🚀 Start Verification
            </button>
        </div>

        <!-- Navigation Buttons -->
        <div id="navButtons" style="display: none;" class="text-center mb-4">
            <button class="btn btn-custom m-1" onclick="showVerification(1)">Vérification 1</button>
            <button class="btn btn-custom m-1" onclick="showVerification(2)">Vérification 2</button>
        </div>

        <!-- Verification 1 Interface -->
        <div id="verification1Interface" style="display: none;">
            <div class="row mt-4">
                <div class="col-md-6">
                    <h5>Paramètres Matériau</h5>
                    <div class="input-group">
                        <label class="form-label">Nsd (kN):</label>
                        <input type="number" id="Nsd" class="form-control" value="650">
                    </div>
                    <div class="input-group">
                        <label class="form-label">Fy (MPa):</label>
                        <input type="number" id="Fy" class="form-control" value="275">
                    </div>
                    <div class="input-group">
                        <label class="form-label">γ<sub>M0</sub>:</label>
                        <input type="number" id="gammaM0" class="form-control" value="1.0" step="0.01">
                    </div>
                    <div class="input-group">
                        <label class="form-label">γ<sub>M2</sub>:</label>
                        <input type="number" id="gammaM2" class="form-control" value="1.25" step="0.01">
                    </div>
                </div>

                <div class="col-md-6">
                    <h5>Géométrie</h5>
                    <div class="input-group">
                        <label class="form-label">L (mm):</label>
                        <input type="number" id="L" class="form-control" value="230">
                    </div>
                    <div class="input-group">
                        <label class="form-label">t (mm):</label>
                        <input type="number" id="t" class="form-control" value="13">
                    </div>
                    <div class="input-group">
                        <label class="form-label">S1 (mm):</label>
                        <input type="number" id="S1" class="form-control" value="65">
                    </div>
                    <div class="input-group">
                        <label class="form-label">S2 (mm):</label>
                        <input type="number" id="S2" class="form-control" value="65">
                    </div>
                    <div class="input-group">
                        <label class="form-label">P1 (mm):</label>
                        <input type="number" id="P1" class="form-control" value="45">
                    </div>
                    <div class="input-group">
                        <label class="form-label">P2 (mm):</label>
                        <input type="number" id="P2" class="form-control" value="0">
                    </div>
                    <div class="input-group">
                        <label class="form-label">d0 (mm):</label>
                        <input type="number" id="d0" class="form-control" value="22">
                    </div>
                </div>
            </div>

            <button class="btn btn-custom w-100 mt-4" onclick="calculate()">🧮 Calculer</button>

            <div class="result-box mt-4">
                <h5>Résultats</h5>
                <div id="results"></div>
                <div id="verification" class="mt-3"></div>
            </div>
        </div>

        <!-- Verification 2 Interface -->
        <div id="verification2Interface" style="display: none;">
            <div class="row mt-4">
                <div class="col-md-6">
                    <h5>Paramètres Poutre</h5>
                    <div class="input-group">
                        <label class="form-label">Profilé:</label>
                        <select id="profil" class="form-select">
                            <option value="HEA450">HEA450</option>
                            <option value="HEA340">HEA340</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label class="form-label">Fy (MPa):</label>
                        <input type="number" id="fy" class="form-control" value="235">
                    </div>
                    <div class="input-group">
                        <label class="form-label">Classe:</label>
                        <input type="number" id="classe" class="form-control" value="1" min="1" max="4">
                    </div>
                    <div class="input-group">
                        <label class="form-label">Longueur (mm):</label>
                        <input type="number" id="longueur" class="form-control" value="8000">
                    </div>
                    <div class="input-group">
                        <label class="form-label">Type d'appuis:</label>
                        <select id="appuis" class="form-select">
                            <option value="bi-appuyée">Bi-appuyée</option>
                            <option value="bi-encastrée">Bi-encastrée</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label class="form-label">Moment appliqué (MN.m):</label>
                        <input type="number" id="Msd" class="form-control" value="0.5">
                    </div>
                    <div class="input-group">
                        <label class="form-label">Q (MN):</label>
                        <input type="number" id="Q" class="form-control" value="0.5">
                    </div>
                    <div class="input-group">
                        <label class="form-label">Type de profilé:</label>
                        <select id="typeProfile" class="form-select">
                            <option value="laminé">Laminé</option>
                            <option value="soudé">Soudé</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label class="form-label">Nsd (MN):</label>
                        <input type="number" id="Nsd2" class="form-control" value="0.5">
                    </div>
                </div>
            </div>

            <button class="btn btn-custom w-100 mt-4" onclick="calculate116()">🧮 Calculer Vérification 2</button>

            <div class="result-box mt-4">
                <h5>Résultats Flexion Déviee</h5>
                <div id="results116"></div>
                <div id="verification116" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Customization Functions
    document.getElementById('bgUpload').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function() {
            document.getElementById('backgroundImage').src = reader.result;
            document.getElementById('emojiPicker').style.display = 'flex';
        }
        reader.readAsDataURL(e.target.files[0]);
    });

    function addEmoji(emoji) {
        const e = document.createElement('div');
        e.style.position = 'absolute';
        e.style.left = Math.random() * 80 + '%';
        e.style.top = Math.random() * 80 + '%';
        e.style.fontSize = (Math.random() * 20 + 20) + 'px';
        e.style.cursor = 'pointer';
        e.textContent = emoji;
        e.onclick = () => e.remove();
        document.body.appendChild(e);
    }

    function startVerification() {
        document.getElementById('startSection').style.display = 'none';
        document.getElementById('navButtons').style.display = 'block';
        document.getElementById('verification1Interface').style.display = 'block';
    }

    function showVerification(num) {
        document.getElementById('verification1Interface').style.display = 'none';
        document.getElementById('verification2Interface').style.display = 'none';

        if(num === 1) {
            document.getElementById('verification1Interface').style.display = 'block';
        } else {
            document.getElementById('verification2Interface').style.display = 'block';
        }
    }

    function calculate() {
        const inputs = {
            Nsd: parseFloat(document.getElementById('Nsd').value),
            Fy: parseFloat(document.getElementById('Fy').value),
            gammaM0: parseFloat(document.getElementById('gammaM0').value),
            gammaM2: parseFloat(document.getElementById('gammaM2').value),
            L: parseFloat(document.getElementById('L').value),
            t: parseFloat(document.getElementById('t').value),
            S1: parseFloat(document.getElementById('S1').value),
            S2: parseFloat(document.getElementById('S2').value),
            P1: parseFloat(document.getElementById('P1').value),
            P2: parseFloat(document.getElementById('P2').value),
            d0: parseFloat(document.getElementById('d0').value)
        };

        let Fu;
        switch(inputs.Fy) {
            case 235: Fu = 360; break;
            case 275: Fu = 430; break;
            case 355: Fu = 510; break;
            default: Fu = 430;
        }

        const A = inputs.L * inputs.t;
        const At1 = 2 * inputs.t * inputs.d0;

        let At2;
        if(inputs.P2 === 0) {
            At2 = 2 * inputs.t * inputs.d0;
        } else {
            At2 = inputs.t * (3 * inputs.d0
                - (Math.pow(inputs.P1, 2)/(4 * inputs.S1))
                - (Math.pow(inputs.P2, 2)/(4 * inputs.S2)));
        }

        let At3 = 0;
        if(inputs.P2 !== 0) {
            At3 = inputs.t * (3 * inputs.d0
                - (Math.pow(inputs.P1, 2)/(4 * inputs.S1))
                - (Math.pow(inputs.P1, 2)/(4 * inputs.S2)));
        }

        const At = Math.max(At1, At2, At3);
        const Anette = A - At;

        const Npl = (A * inputs.Fy) / inputs.gammaM0;
        const Nu = (0.9 * Anette * Fu) / inputs.gammaM2;
        const Nnet = (Anette * inputs.Fy) / inputs.gammaM0;
        const NR = Math.min(Npl, Nu, Nnet);
        const Nsd_N = inputs.Nsd * 1000; // Conversion kN → N
        const verification = Nsd_N <= NR;

        const resultsHTML = `
            <p>F<sub>u</sub>: ${Fu} MPa</p>
            <p>A (Brute): ${A.toFixed(2)} mm²</p>
            <p>At1 (n=2): ${At1.toFixed(2)} mm²</p>
            <p>At2: ${At2.toFixed(2)} mm²</p>
            <p>At3: ${At3.toFixed(2)} mm²</p>
            <p>At (Max): ${At.toFixed(2)} mm²</p>
            <p>A<sub>nette</sub>: ${Anette.toFixed(2)} mm²</p>
            <p>N<sub>pl</sub>: ${(Npl/1000).toFixed(2)} kN</p>
            <p>N<sub>u</sub>: ${(Nu/1000).toFixed(2)} kN</p>
            <p>N<sub>net</sub>: ${(Nnet/1000).toFixed(2)} kN</p>
            <p>N<sub>R</sub>: ${(NR/1000).toFixed(2)} kN</p>
        `;

        const verificationHTML = verification
            ? `<p class="verified">✅ VÉRIFIÉ (${inputs.Nsd} kN ≤ ${(NR/1000).toFixed(2)} kN)</p>`
            : `<p class="not-verified">❌ NON VÉRIFIÉ (${inputs.Nsd} kN > ${(NR/1000).toFixed(2)} kN)</p>`;

        document.getElementById('results').innerHTML = resultsHTML;
        document.getElementById('verification').innerHTML = verificationHTML;
    }

    function calculate116() {
        const inputs = {
            profil: document.getElementById('profil').value,
            fy: parseFloat(document.getElementById('fy').value),
            classe: parseInt(document.getElementById('classe').value),
            longueur: parseFloat(document.getElementById('longueur').value),
            appuis: document.getElementById('appuis').value,
            Msd: parseFloat(document.getElementById('Msd').value),
            Q: parseFloat(document.getElementById('Q').value),
            typeProfile: document.getElementById('typeProfile').value,
            Nsd2: parseFloat(document.getElementById('Nsd2').value)
        };

        const profiles = {
            HEA450: {
                Wpl: 3216000,
                Iz: 94650000,
                It: 2438000,
                Iw: 4.148e12,
                h: 440,
                A: 17800
            },
            HEA340: {
                Wpl: 1850000,
                Iz: 74360000,
                It: 1272000,
                Iw: 1.824e12,
                h: 330,
                A: 13350
            }
        };

        const E = 210000;
        const G = 80770;
        const gammaM1 = 1.1;
        const alphaLT = 0.21;

        const profile = profiles[inputs.profil];

        let C1;
        if(inputs.appuis === "bi-appuyée") {
            C1 = 1.132;
        } else {
            C1 = 0.938;
        }

        const Mcr = C1 * (Math.PI**2 * E * profile.Iz / (inputs.longueur**2)) *
                  Math.sqrt((profile.Iw / profile.Iz) +
                  (inputs.longueur**2 * G * profile.It) / (Math.PI**2 * E * profile.Iz));

        const lambdaLT = Math.sqrt((profile.Wpl * inputs.fy) / Mcr);
        const phiLT = 0.5 * (1 + alphaLT * (lambdaLT - 0.2) + lambdaLT**2);
        const chiLT = Math.min(1 / (phiLT + Math.sqrt(phiLT**2 - lambdaLT**2)), 1.0);
        const MbRd = chiLT * profile.Wpl * inputs.fy / gammaM1;

        const verification = inputs.Msd <= MbRd / 1e6;

        const resultsHTML = `
            <p>M<sub>cr</sub>: ${(Mcr/1e6).toFixed(3)} MN.m</p>
            <p>λ<sub>LT</sub>: ${lambdaLT.toFixed(3)}</p>
            <p>χ<sub>LT</sub>: ${chiLT.toFixed(3)}</p>
            <p>M<sub>b,Rd</sub>: ${(MbRd/1e6).toFixed(3)} MN.m</p>
        `;

        const verificationHTML = verification
            ? `<p class="verified">✅ VÉRIFIÉ (${inputs.Msd} MN.m ≤ ${(MbRd/1e6).toFixed(3)} MN.m)</p>`
            : `<p class="not-verified">❌ NON VÉRIFIÉ (${inputs.Msd} MN.m > ${(MbRd/1e6).toFixed(3)} MN.m)</p>`;

        document.getElementById('results116').innerHTML = resultsHTML;
        document.getElementById('verification116').innerHTML = verificationHTML;
    }
</script>
</body>
</html>
